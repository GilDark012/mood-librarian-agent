name: Deploy to Hugging Face Space

# Pushes the repository to a Hugging Face Space on every push to main, which
# triggers the Space to rebuild the Docker image and redeploy.
#
# Setup (one-time), done in the GitHub repo settings:
#   - Secret  HF_TOKEN  : a Hugging Face access token with WRITE permission.
#   - Variable HF_SPACE : the Space path, e.g. "your-username/mood-librarian".
# The job is skipped until HF_SPACE is set, so it never fails before setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          HF_USERNAME="${HF_SPACE%%/*}"
          git push --force \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git" \
            HEAD:main
