name: Keep Render warm

# Pings the deployed app's /health endpoint so the free Render instance does
# not sleep (it idles out after ~15 min of no traffic, adding a ~30-60s cold
# start to the next request).
#
# The schedule runs only during daytime (UTC) to stay well within Render's
# free monthly instance-hours budget. Widen or narrow the hour range below,
# or run it manually from the Actions tab (workflow_dispatch).
#
# Notes:
# - GitHub cron runs can be delayed by several minutes under load, so an
#   occasional cold start is still possible (the UI shows a "waking up"
#   message for that case).
# - GitHub disables scheduled workflows after 60 days with no repo commits.

on:
  schedule:
    # Every 10 minutes, 06:00-20:59 UTC (~07:00-22:00 Paris).
    - cron: "*/10 6-20 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 60 https://mood-librarian.onrender.com/health || true
