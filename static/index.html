<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bibliothécaire de l'Humeur</title>
  <style>
    :root {
      --indigo: #4f46e5;
      --purple: #7c3aed;
      --bg: #f5f5fb;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
    header {
      background: linear-gradient(135deg, var(--indigo), var(--purple));
      color: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      margin-top: 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 6px; font-size: 1.6rem; }
    header p { margin: 0; opacity: 0.92; font-size: 0.98rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-top: 16px;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 10px;
      resize: vertical;
    }
    textarea:focus-visible, button:focus-visible {
      outline: 3px solid rgba(124, 58, 237, 0.4);
      outline-offset: 2px;
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
    .count { color: var(--muted); font-size: 0.85rem; }
    button {
      background: var(--indigo);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--purple); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-top-color: #fff;
      border-radius: 50%;
      display: inline-block;
      vertical-align: -3px;
      margin-right: 8px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #result { margin-top: 16px; }
    .result-card { white-space: pre-wrap; word-wrap: break-word; }
    .result-card a { color: var(--indigo); }
    .blocked {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }
    .error { color: var(--danger-text); }
    .waking { color: var(--muted); }
    .pill { display: inline-block; padding: 0 8px; border-radius: 999px; background: rgba(99,91,255,0.14); font-size: 0.82em; white-space: nowrap; }
    .modes { display: flex; gap: 8px; margin-bottom: 14px; }
    .mode { width: auto; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 0.92rem; }
    .mode.active { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    #target-wrap { margin-top: 12px; }
    .meta { color: var(--muted); font-size: 0.82rem; margin-top: 12px; }
    footer { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 22px 0; }
    footer a { color: var(--muted); }
    .hidden { display: none; }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161c; --card: #1e2230; --text: #e8eaf0; --muted: #9aa3b2; --border: #2c3242;
        --danger-bg: #3b1d1d; --danger-border: #6b2b2b; --danger-text: #fca5a5;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📚 Bibliothécaire de l'Humeur</h1>
      <p>Décrivez votre humeur, recevez un manga à lire — et pourquoi.</p>
    </header>

    <main class="card">
      <div class="modes" role="group" aria-label="Mode">
        <button type="button" class="mode active" id="mode-reco" aria-pressed="true">Un manga</button>
        <button type="button" class="mode" id="mode-journey" aria-pressed="false">Parcours d'humeur</button>
      </div>
      <form id="form">
        <label for="mood" id="mood-label">Comment vous sentez-vous ?</label>
        <textarea id="mood" name="mood" maxlength="500"
          placeholder="Ex. : je me sens nostalgique et un peu rêveur…"
          aria-describedby="count"></textarea>
        <div id="target-wrap" class="hidden">
          <label for="target">Où aimeriez-vous arriver ? (optionnel)</label>
          <textarea id="target" maxlength="500"
            placeholder="Ex. : retrouver de la sérénité et de l'élan…"></textarea>
        </div>
        <div class="row">
          <span class="count" id="count" aria-live="polite">0 / 500</span>
          <button type="submit" id="submit">Trouver un manga</button>
        </div>
      </form>

      <div id="result" role="status" aria-live="polite"></div>
    </main>

    <footer>
      <p>Recommandations générées par IA — ni avis médical ni psychologique.
      En cas de détresse&nbsp;: <strong>3114</strong> (France) · urgences&nbsp;: 15 / 112.</p>
      <p><a href="/docs">API (Swagger)</a></p>
    </footer>
  </div>

  <script>
    const form = document.getElementById("form");
    const mood = document.getElementById("mood");
    const target = document.getElementById("target");
    const targetWrap = document.getElementById("target-wrap");
    const moodLabel = document.getElementById("mood-label");
    const modeReco = document.getElementById("mode-reco");
    const modeJourney = document.getElementById("mode-journey");
    const count = document.getElementById("count");
    const submit = document.getElementById("submit");
    const result = document.getElementById("result");

    let mode = "reco";
    function setMode(m) {
      mode = m;
      const journey = m === "journey";
      modeReco.classList.toggle("active", !journey);
      modeJourney.classList.toggle("active", journey);
      modeReco.setAttribute("aria-pressed", String(!journey));
      modeJourney.setAttribute("aria-pressed", String(journey));
      targetWrap.classList.toggle("hidden", !journey);
      moodLabel.textContent = journey
        ? "Comment vous sentez-vous maintenant ?"
        : "Comment vous sentez-vous ?";
      submit.textContent = journey ? "Construire mon parcours" : "Trouver un manga";
      result.replaceChildren();
    }
    modeReco.addEventListener("click", () => setMode("reco"));
    modeJourney.addEventListener("click", () => setMode("journey"));

    mood.addEventListener("input", () => {
      count.textContent = `${mood.value.length} / 500`;
    });

    // Ctrl/Cmd+Enter submits.
    mood.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") form.requestSubmit();
    });

    // Build a node from text, turning **bold** into <strong> and URLs into
    // safe links. Built with text nodes / elements only (no innerHTML).
    function render(text) {
      const frag = document.createDocumentFragment();
      const re = /\*\*(.+?)\*\*|(https?:\/\/[^\s]+)|(⭐\s*[0-9][0-9.,]*(?:\s*\/\s*10)?)|\b(Seinen|Shōnen|Shonen|Shōjo|Shojo|Josei|Kodomo)\b/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        if (m[1] !== undefined) {
          const strong = document.createElement("strong");
          strong.textContent = m[1];
          frag.appendChild(strong);
        } else if (m[2] !== undefined) {
          const a = document.createElement("a");
          a.href = m[2];
          a.textContent = m[2];
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          frag.appendChild(a);
        } else {
          const span = document.createElement("span");
          span.className = "pill";
          span.textContent = m[3] !== undefined ? m[3] : m[4];
          frag.appendChild(span);
        }
        last = re.lastIndex;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      return frag;
    }

    function showCard(node, extraClass) {
      result.replaceChildren();
      const div = document.createElement("div");
      div.className = "card result-card" + (extraClass ? " " + extraClass : "");
      if (typeof node === "string") div.appendChild(render(node));
      else div.appendChild(node);
      result.appendChild(div);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const value = mood.value.trim();
      if (!value) { showCard("Veuillez décrire votre humeur.", "error"); return; }

      const journey = mode === "journey";
      const endpoint = journey ? "/journey" : "/recommend";
      const body = journey
        ? { current_mood: value, desired_mood: target.value.trim() }
        : { mood: value };
      const idleLabel = journey ? "Construire mon parcours" : "Trouver un manga";

      submit.disabled = true;
      submit.innerHTML = `<span class="spinner"></span>${journey ? "Construction…" : "Recherche…"}`;
      result.replaceChildren();

      // Free hosting sleeps after inactivity; the first request may wake it.
      const wakeTimer = setTimeout(() => {
        showCard("⏳ Le service se réveille (hébergement gratuit), cela peut prendre ~30 s…", "waking");
      }, 4000);

      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        if (res.status === 422) { showCard("Humeur invalide (1 à 500 caractères).", "error"); return; }
        if (res.status === 429) { showCard("Trop de requêtes, patientez un instant puis réessayez.", "error"); return; }

        const data = await res.json().catch(() => ({}));

        if (data.status === "blocked") {
          showCard(data.message || "Requête bloquée.", "blocked");
        } else if (data.status === "success") {
          const box = document.createElement("div");
          box.appendChild(render(journey ? (data.journey || "") : (data.recommendation || "")));
          if (data.disclaimer) {
            const d = document.createElement("div");
            d.className = "meta";
            d.textContent = data.disclaimer;
            box.appendChild(d);
          }
          showCard(box);
        } else {
          showCard(data.message || "Une erreur est survenue. Réessayez plus tard.", "error");
        }
      } catch (err) {
        showCard("Impossible de contacter le service. Vérifiez votre connexion.", "error");
      } finally {
        clearTimeout(wakeTimer);
        submit.disabled = false;
        submit.textContent = idleLabel;
      }
    });
  </script>
</body>
</html>
